<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Where a person steps in</title><desc id="d">Document verification, publishing an allotment, grievances, and pause extend or rollback each need a person.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#f4f4f6" text-anchor="start">Where a person steps in</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">Four checkpoints, one rule</text>
<rect x="24" y="92" width="346" height="108" rx="14" fill="#1b1b20" stroke="#6f9cf0" stroke-width="2.5"/>
<circle cx="60" cy="130" r="18" fill="#6f9cf0"/>
<text x="60" y="136" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="90" y="136" font-size="17" font-weight="700" fill="#f4f4f6" text-anchor="start">Document verification</text>
<text x="90" y="162" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">If the system is less sure,</text>
<text x="90" y="182" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">a reviewer decides.</text>
<rect x="390" y="92" width="346" height="108" rx="14" fill="#1b1b20" stroke="#f7b955" stroke-width="2.5"/>
<circle cx="426" cy="130" r="18" fill="#f7b955"/>
<text x="426" y="136" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="456" y="136" font-size="17" font-weight="700" fill="#f4f4f6" text-anchor="start">Publishing an allotment</text>
<text x="456" y="162" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">The authority signs off</text>
<text x="456" y="182" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">before students see it.</text>
<rect x="24" y="220" width="346" height="108" rx="14" fill="#1b1b20" stroke="#a58bff" stroke-width="2.5"/>
<circle cx="60" cy="258" r="18" fill="#a58bff"/>
<text x="60" y="264" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="90" y="264" font-size="17" font-weight="700" fill="#f4f4f6" text-anchor="start">Grievances</text>
<text x="90" y="290" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">A person resolves</text>
<text x="90" y="310" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">every dispute.</text>
<rect x="390" y="220" width="346" height="108" rx="14" fill="#1b1b20" stroke="#ff5b80" stroke-width="2.5"/>
<circle cx="426" cy="258" r="18" fill="#ff5b80"/>
<text x="426" y="264" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="456" y="264" font-size="17" font-weight="700" fill="#f4f4f6" text-anchor="start">Pause, extend, rollback</text>
<text x="456" y="290" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">Each needs explicit</text>
<text x="456" y="310" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">authorisation.</text>
<rect x="24" y="358" width="712" height="52" rx="12" fill="#1b1b20" stroke="#33333b" stroke-width="2"/>
<text x="380" y="380" font-size="14.5" font-weight="700" fill="#f4f4f6" text-anchor="middle">The rule: if a decision could change whether a student gets a seat,</text>
<text x="380" y="399" font-size="14.5" font-weight="700" fill="#f4f4f6" text-anchor="middle">a person reviews it before it becomes final.</text>
</svg>