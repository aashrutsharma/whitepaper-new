<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The three parts of Superadmission</title><desc id="d">Manifest, the Superadmission Console and PraveshAI.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#111113" text-anchor="start">The three parts of Superadmission</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">From discovering colleges to securing a seat</text>
<rect x="20" y="96" width="208" height="120" rx="14" fill="#f6f6f8" stroke="#4d82e0" stroke-width="2.5"/>
<text x="124.0" y="143.0" font-size="17" font-weight="700" fill="#111113" text-anchor="middle">Manifest</text>
<text x="124.0" y="165.0" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">Every college, university</text>
<text x="124.0" y="184.0" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">and standalone institution</text>
<line x1="234" y1="156" x2="270" y2="156" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M270.0,156.0 L260.1,160.8 L260.1,151.2 Z" fill="#5c5c64"/>
<rect x="276" y="96" width="208" height="120" rx="14" fill="#f6f6f8" stroke="#ee9d2b" stroke-width="2.5"/>
<text x="380.0" y="143.0" font-size="17" font-weight="700" fill="#111113" text-anchor="middle">Console</text>
<text x="380.0" y="165.0" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">Where students register</text>
<text x="380.0" y="184.0" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">and secure a seat</text>
<line x1="490" y1="156" x2="526" y2="156" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M526.0,156.0 L516.1,160.8 L516.1,151.2 Z" fill="#5c5c64"/>
<rect x="532" y="96" width="208" height="120" rx="14" fill="#f6f6f8" stroke="#34a56f" stroke-width="2.5"/>
<text x="636.0" y="143.0" font-size="17" font-weight="700" fill="#111113" text-anchor="middle">PraveshAI</text>
<text x="636.0" y="165.0" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">Guidance for students</text>
<text x="636.0" y="184.0" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">through counselling</text>
</svg>