<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Three layers, one system</title><desc id="d">Manifest feeds Superadmission, which feeds PraveshAI.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#f4f4f6" text-anchor="start">Three layers, one system</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">Each layer depends on the one before it</text>
<rect x="20" y="96" width="208" height="140" rx="14" fill="#1b1b20" stroke="#6f9cf0" stroke-width="2.5"/>
<text x="124.0" y="153.0" font-size="20" font-weight="700" fill="#f4f4f6" text-anchor="middle">Manifest</text>
<text x="124.0" y="175.0" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">What is this institution,</text>
<text x="124.0" y="194.0" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">and can it be trusted?</text>
<line x1="234" y1="166" x2="270" y2="166" stroke="#a9a9b2" stroke-width="2.5" stroke-linecap="round"/>
<path d="M270.0,166.0 L260.1,170.8 L260.1,161.2 Z" fill="#a9a9b2"/>
<rect x="276" y="96" width="208" height="140" rx="14" fill="#1b1b20" stroke="#f7b955" stroke-width="2.5"/>
<text x="380.0" y="153.0" font-size="20" font-weight="700" fill="#f4f4f6" text-anchor="middle">Superadmission</text>
<text x="380.0" y="175.0" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">How does a student</text>
<text x="380.0" y="194.0" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">actually get admitted?</text>
<line x1="490" y1="166" x2="526" y2="166" stroke="#a9a9b2" stroke-width="2.5" stroke-linecap="round"/>
<path d="M526.0,166.0 L516.1,170.8 L516.1,161.2 Z" fill="#a9a9b2"/>
<rect x="532" y="96" width="208" height="140" rx="14" fill="#1b1b20" stroke="#58cf97" stroke-width="2.5"/>
<text x="636.0" y="143.5" font-size="20" font-weight="700" fill="#f4f4f6" text-anchor="middle">PraveshAI</text>
<text x="636.0" y="165.5" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">What should this student</text>
<text x="636.0" y="184.5" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">do, given their rank and</text>
<text x="636.0" y="203.5" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">preferences?</text>
<text x="24" y="266" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="start">Manifest is the data layer. PraveshAI is the thinking layer.</text>
<text x="24" y="284" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="start">Superadmission connects both to a student's admission.</text>
</svg>