<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">What a document's confidence score decides</title><desc id="d">Below 50 priority review, 50 to 79 standard queue, 80 to 100 cleared automatically.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#111113" text-anchor="start">What a document's confidence score decides</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">The automated check scores each uploaded document from 0 to 100</text>
<rect x="41.5" y="100" width="337.0" height="58" rx="10" fill="#e63059"/>
<text x="210.0" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Priority review</text>
<rect x="381.5" y="100" width="201.0" height="58" rx="10" fill="#ee9d2b"/>
<text x="482.0" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Standard review</text>
<rect x="585.5" y="100" width="133.0" height="58" rx="10" fill="#34a56f"/>
<text x="652.0" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Cleared</text>
<text x="40.0" y="184" font-size="14" font-weight="600" fill="#5c5c64" text-anchor="middle">0</text>
<text x="380.0" y="184" font-size="14" font-weight="600" fill="#5c5c64" text-anchor="middle">50</text>
<text x="584.0" y="184" font-size="14" font-weight="600" fill="#5c5c64" text-anchor="middle">80</text>
<text x="720.0" y="184" font-size="14" font-weight="600" fill="#5c5c64" text-anchor="middle">100</text>
<text x="210.0" y="214" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Below 50</text>
<text x="210.0" y="234" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">A person looks at it</text>
<text x="210.0" y="253" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">directly.</text>
<text x="482.0" y="214" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">50 to 79</text>
<text x="482.0" y="234" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">Goes to the standard</text>
<text x="482.0" y="253" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">review queue.</text>
<text x="652.0" y="214" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">80 to 100</text>
<text x="652.0" y="234" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">Cleared automatically,</text>
<text x="652.0" y="253" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">with little or no</text>
<text x="652.0" y="272" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">manual review.</text>
</svg>