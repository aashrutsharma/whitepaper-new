<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Four digital building blocks</title><desc id="d">Aadhaar, DigiLocker, APAAR and ABC</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#f4f4f6" text-anchor="start">Four digital building blocks</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">Each one connects to the next</text>
<rect x="30" y="96" width="148" height="190" rx="16" fill="#1b1b20" stroke="#6f9cf0" stroke-width="2.5"/>
<rect x="30" y="96" width="148" height="48" rx="16" fill="#6f9cf0"/>
<rect x="30" y="126" width="148" height="18" rx="0" fill="#6f9cf0"/>
<text x="104.0" y="127" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Aadhaar</text>
<text x="104.0" y="178" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">Your identity</text>
<text x="104.0" y="200" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">number. One</text>
<text x="104.0" y="222" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">per person.</text>
<rect x="52" y="246" width="104" height="26" rx="13" fill="none" stroke="#6f9cf0" stroke-width="1.8"/>
<text x="104.0" y="264" font-size="13.5" font-weight="600" fill="#6f9cf0" text-anchor="middle">12 digits</text>
<line x1="184" y1="191" x2="206" y2="191" stroke="#a9a9b2" stroke-width="2.5" stroke-linecap="round"/>
<path d="M212,191 l-9,-6 l0,12 z" fill="#a9a9b2"/>
<rect x="214" y="96" width="148" height="190" rx="16" fill="#1b1b20" stroke="#a58bff" stroke-width="2.5"/>
<rect x="214" y="96" width="148" height="48" rx="16" fill="#a58bff"/>
<rect x="214" y="126" width="148" height="18" rx="0" fill="#a58bff"/>
<text x="288.0" y="127" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">DigiLocker</text>
<text x="288.0" y="178" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">A safe online</text>
<text x="288.0" y="200" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">locker for your</text>
<text x="288.0" y="222" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">documents.</text>
<rect x="236" y="246" width="104" height="26" rx="13" fill="none" stroke="#a58bff" stroke-width="1.8"/>
<text x="288.0" y="264" font-size="13.5" font-weight="600" fill="#a58bff" text-anchor="middle">Since 2015</text>
<line x1="368" y1="191" x2="390" y2="191" stroke="#a9a9b2" stroke-width="2.5" stroke-linecap="round"/>
<path d="M396,191 l-9,-6 l0,12 z" fill="#a9a9b2"/>
<rect x="398" y="96" width="148" height="190" rx="16" fill="#1b1b20" stroke="#58cf97" stroke-width="2.5"/>
<rect x="398" y="96" width="148" height="48" rx="16" fill="#58cf97"/>
<rect x="398" y="126" width="148" height="18" rx="0" fill="#58cf97"/>
<text x="472.0" y="127" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">APAAR</text>
<text x="472.0" y="178" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">Your lifelong</text>
<text x="472.0" y="200" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">student ID</text>
<text x="472.0" y="222" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">number.</text>
<rect x="420" y="246" width="104" height="26" rx="13" fill="none" stroke="#58cf97" stroke-width="1.8"/>
<text x="472.0" y="264" font-size="13.5" font-weight="600" fill="#58cf97" text-anchor="middle">Since 2024</text>
<line x1="552" y1="191" x2="574" y2="191" stroke="#a9a9b2" stroke-width="2.5" stroke-linecap="round"/>
<path d="M580,191 l-9,-6 l0,12 z" fill="#a9a9b2"/>
<rect x="582" y="96" width="148" height="190" rx="16" fill="#1b1b20" stroke="#f7b955" stroke-width="2.5"/>
<rect x="582" y="96" width="148" height="48" rx="16" fill="#f7b955"/>
<rect x="582" y="126" width="148" height="18" rx="0" fill="#f7b955"/>
<text x="656.0" y="127" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">ABC</text>
<text x="656.0" y="178" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">A bank for the</text>
<text x="656.0" y="200" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">study credits</text>
<text x="656.0" y="222" font-size="15" font-weight="400" fill="#f4f4f6" text-anchor="middle">you earn.</text>
<rect x="604" y="246" width="104" height="26" rx="13" fill="none" stroke="#f7b955" stroke-width="1.8"/>
<text x="656.0" y="264" font-size="13.5" font-weight="600" fill="#f7b955" text-anchor="middle">Since 2021</text>
<text x="24" y="316" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">Together they let a verified record travel with the student.</text>
</svg>