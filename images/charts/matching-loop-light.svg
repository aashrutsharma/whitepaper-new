<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How seats get matched</title><desc id="d">Student lists and seat orders go into a matching process that repeats until no better match exists.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#111113" text-anchor="start">How seats get matched</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">How students and seats get matched, in one picture</text>
<rect x="24" y="92" width="210" height="74" rx="14" fill="#f6f6f8" stroke="#4d82e0" stroke-width="2.5"/>
<text x="129.0" y="125.5" font-size="15.5" font-weight="700" fill="#111113" text-anchor="middle">Students' ranked</text>
<text x="129.0" y="147.5" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">preference lists</text>
<rect x="24" y="206" width="210" height="74" rx="14" fill="#f6f6f8" stroke="#8a5cf0" stroke-width="2.5"/>
<text x="129.0" y="239.5" font-size="15.5" font-weight="700" fill="#111113" text-anchor="middle">Seats' eligibility</text>
<text x="129.0" y="261.5" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">and merit order</text>
<rect x="290" y="130" width="170" height="90" rx="14" fill="#f6f6f8" stroke="#ee9d2b" stroke-width="2.5"/>
<text x="375.0" y="171.5" font-size="17" font-weight="700" fill="#111113" text-anchor="middle">Matching</text>
<text x="375.0" y="193.5" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">process runs</text>
<line x1="236" y1="129" x2="288" y2="160" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M288.0,160.0 L277.0,159.0 L281.9,150.8 Z" fill="#5c5c64"/>
<line x1="236" y1="243" x2="288" y2="192" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M288.0,192.0 L284.3,202.4 L277.6,195.5 Z" fill="#5c5c64"/>
<path d="M590,115.0 L685.0,175 L590,235.0 L495.0,175 Z" fill="#f6f6f8" stroke="#8a8a94" stroke-width="2.5"/>
<text x="590" y="162" font-size="13.5" font-weight="600" fill="#111113" text-anchor="middle">Better match</text>
<text x="590" y="180" font-size="13.5" font-weight="600" fill="#111113" text-anchor="middle">possible for</text>
<text x="590" y="198" font-size="13.5" font-weight="600" fill="#111113" text-anchor="middle">anyone?</text>
<line x1="462" y1="175" x2="494" y2="175" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M494.0,175.0 L484.1,179.8 L484.1,170.2 Z" fill="#5c5c64"/>
<path d="M590,115 L590,78 L375,78 L375,126" fill="none" stroke="#ee9d2b" stroke-width="2.5" stroke-dasharray="6 4"/>
<path d="M375,128 l-6,-11 l12,0 z" fill="#ee9d2b"/>
<text x="500" y="70" font-size="14" font-weight="700" fill="#ee9d2b" text-anchor="middle">Yes: run it again</text>
<line x1="590" y1="235" x2="590" y2="290" stroke="#34a56f" stroke-width="2.5" stroke-linecap="round"/>
<path d="M590.0,290.0 L585.2,280.1 L594.8,280.1 Z" fill="#34a56f"/>
<text x="612" y="266" font-size="13.5" font-weight="600" fill="#34a56f" text-anchor="middle">No</text>
<rect x="470" y="292" width="240" height="66" rx="14" fill="#f6f6f8" stroke="#34a56f" stroke-width="2.5"/>
<text x="590.0" y="321.5" font-size="16" font-weight="700" fill="#111113" text-anchor="middle">Stable match reached</text>
<text x="590.0" y="343.5" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="middle">Result goes to the authority</text>
<text x="24" y="388" font-size="13.5" font-weight="400" fill="#5c5c64" text-anchor="start">A stable match means nobody can be matched any better. It is a proposed result, not a published one.</text>
</svg>