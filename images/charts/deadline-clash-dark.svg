<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Two deadlines, one timeline</title><desc id="d">A JoSAA acceptance window closes Tuesday 11:59 PM and a state CET window closes Thursday 5:00 PM.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#f4f4f6" text-anchor="start">Two deadlines, one timeline</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">An example of what the dashboard shows together</text>
<line x1="50" y1="190" x2="710" y2="190" stroke="#33333b" stroke-width="4" stroke-linecap="round"/>
<rect x="50" y="166" width="150" height="48" rx="10" fill="#f7b955" opacity="0.25"/>
<text x="125" y="196" font-size="15" font-weight="700" fill="#f7b955" text-anchor="middle">Decide here</text>
<circle cx="200" cy="190" r="11" fill="#6f9cf0"/>
<circle cx="200" cy="190" r="5" fill="#1b1b20"/>
<text x="200" y="138" font-size="16" font-weight="700" fill="#f4f4f6" text-anchor="middle">JoSAA acceptance</text>
<text x="200" y="160" font-size="14" font-weight="500" fill="#a9a9b2" text-anchor="middle">closes Tue, 11:59 PM</text>
<circle cx="560" cy="190" r="11" fill="#a58bff"/>
<circle cx="560" cy="190" r="5" fill="#1b1b20"/>
<text x="560" y="138" font-size="16" font-weight="700" fill="#f4f4f6" text-anchor="middle">State CET window</text>
<text x="560" y="160" font-size="14" font-weight="500" fill="#a9a9b2" text-anchor="middle">closes Thu, 5:00 PM</text>
<line x1="210" y1="234" x2="550" y2="234" stroke="#a9a9b2" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M550.0,234.0 L540.1,238.8 L540.1,229.2 Z" fill="#a9a9b2"/>
<text x="380" y="226" font-size="13.5" font-weight="600" fill="#a9a9b2" text-anchor="middle">Two days later</text>
<text x="380" y="276" font-size="14.5" font-weight="400" fill="#a9a9b2" text-anchor="middle">Seen apart, each looks like a comfortable window.</text>
<text x="380" y="298" font-size="14.5" font-weight="700" fill="#f4f4f6" text-anchor="middle">Seen together, the real decision is due before the first one closes.</text>
</svg>