<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 806" width="760" height="806" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Timeline of Indian admissions</title><desc id="d">Key moments from 1961 to 2026</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#111113" text-anchor="start">How admissions in India grew, 1961 to 2026</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">Each dot is one big change</text>
<line x1="128" y1="112" x2="128" y2="688" stroke="#dcdce2" stroke-width="3" stroke-linecap="round"/>
<text x="104" y="126" font-size="19" font-weight="700" fill="#4d82e0" text-anchor="end">1961</text>
<circle cx="128" cy="120" r="9" fill="#4d82e0"/>
<circle cx="128" cy="120" r="4" fill="#f6f6f8"/>
<text x="154" y="126" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">IIT entrance exam (JEE) starts</text>
<text x="104" y="182" font-size="19" font-weight="700" fill="#4d82e0" text-anchor="end">2002</text>
<circle cx="128" cy="176" r="9" fill="#4d82e0"/>
<circle cx="128" cy="176" r="4" fill="#f6f6f8"/>
<text x="154" y="182" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">AIEEE starts for NITs and others</text>
<text x="104" y="238" font-size="19" font-weight="700" fill="#4d82e0" text-anchor="end">2013</text>
<circle cx="128" cy="232" r="9" fill="#4d82e0"/>
<circle cx="128" cy="232" r="4" fill="#f6f6f8"/>
<text x="154" y="238" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">JEE splits into JEE Main and JEE Advanced</text>
<text x="104" y="294" font-size="19" font-weight="700" fill="#ee9d2b" text-anchor="end">2015</text>
<circle cx="128" cy="288" r="9" fill="#ee9d2b"/>
<circle cx="128" cy="288" r="4" fill="#f6f6f8"/>
<text x="154" y="294" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">JoSAA created: one counselling for IITs, NITs and more</text>
<text x="104" y="350" font-size="19" font-weight="700" fill="#4d82e0" text-anchor="end">2016</text>
<circle cx="128" cy="344" r="9" fill="#4d82e0"/>
<circle cx="128" cy="344" r="4" fill="#f6f6f8"/>
<text x="154" y="350" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">NEET becomes the national medical exam</text>
<text x="104" y="406" font-size="19" font-weight="700" fill="#8a5cf0" text-anchor="end">2017</text>
<circle cx="128" cy="400" r="9" fill="#8a5cf0"/>
<circle cx="128" cy="400" r="4" fill="#f6f6f8"/>
<text x="154" y="406" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">National Testing Agency (NTA) is set up</text>
<text x="104" y="462" font-size="19" font-weight="700" fill="#8a5cf0" text-anchor="end">2019</text>
<circle cx="128" cy="456" r="9" fill="#8a5cf0"/>
<circle cx="128" cy="456" r="4" fill="#f6f6f8"/>
<text x="154" y="462" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">NTA starts running NEET and JEE Main</text>
<text x="104" y="518" font-size="19" font-weight="700" fill="#34a56f" text-anchor="end">2020</text>
<circle cx="128" cy="512" r="9" fill="#34a56f"/>
<circle cx="128" cy="512" r="4" fill="#f6f6f8"/>
<text x="154" y="518" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">National Education Policy (NEP) approved</text>
<text x="104" y="574" font-size="19" font-weight="700" fill="#4d82e0" text-anchor="end">2022</text>
<circle cx="128" cy="568" r="9" fill="#4d82e0"/>
<circle cx="128" cy="568" r="4" fill="#f6f6f8"/>
<text x="154" y="574" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">CUET UG starts for central universities</text>
<text x="104" y="630" font-size="19" font-weight="700" fill="#34a56f" text-anchor="end">2024</text>
<circle cx="128" cy="624" r="9" fill="#34a56f"/>
<circle cx="128" cy="624" r="4" fill="#f6f6f8"/>
<text x="154" y="630" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">APAAR student ID launched</text>
<text x="104" y="686" font-size="19" font-weight="700" fill="#ee9d2b" text-anchor="end">2026</text>
<circle cx="128" cy="680" r="9" fill="#ee9d2b"/>
<circle cx="128" cy="680" r="4" fill="#f6f6f8"/>
<text x="154" y="686" font-size="16.5" font-weight="500" fill="#111113" text-anchor="start">JoSAA: 138 institutes, 67,323 seats</text>
<circle cx="31" cy="732" r="7" fill="#4d82e0"/>
<text x="46" y="737" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">Exams</text>
<circle cx="122.0" cy="732" r="7" fill="#ee9d2b"/>
<text x="137.0" y="737" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">Counselling</text>
<circle cx="264.6" cy="732" r="7" fill="#8a5cf0"/>
<text x="279.6" y="737" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">Exam body</text>
<circle cx="390.0" cy="732" r="7" fill="#34a56f"/>
<text x="405.0" y="737" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">Policy and digital</text>
</svg>