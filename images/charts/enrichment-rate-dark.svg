<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How often web enrichment finds usable data</title><desc id="d">Above 85 percent for NIRF-ranked institutions and about 40 to 60 percent for any institution.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#f4f4f6" text-anchor="start">How often web enrichment finds usable data</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">For one field of an institution's profile</text>
<text x="24" y="134" font-size="16" font-weight="600" fill="#f4f4f6" text-anchor="start">NIRF-ranked</text>
<text x="24" y="154" font-size="14" font-weight="400" fill="#a9a9b2" text-anchor="start">institutions</text>
<rect x="250" y="118" width="400" height="32" rx="8" fill="#26262c"/>
<rect x="250" y="118" width="340.0" height="32" rx="8" fill="#58cf97"/>
<text x="600.0" y="140" font-size="15" font-weight="700" fill="#f4f4f6" text-anchor="start">Above 85%</text>
<text x="24" y="204" font-size="16" font-weight="600" fill="#f4f4f6" text-anchor="start">Any institution</text>
<rect x="250" y="188" width="400" height="32" rx="8" fill="#26262c"/>
<rect x="250" y="188" width="160.0" height="32" rx="8" fill="#f7b955"/>
<rect x="410.0" y="188" width="80.0" height="32" rx="6" fill="#f7b955" opacity="0.45"/>
<text x="500.0" y="210" font-size="15" font-weight="700" fill="#f4f4f6" text-anchor="start">About 40 to 60%</text>
<text x="24" y="262" font-size="13.5" font-weight="400" fill="#a9a9b2" text-anchor="start">The rest is expected: outdated web addresses, sites that need a full browser, servers that are down.</text>
</svg>