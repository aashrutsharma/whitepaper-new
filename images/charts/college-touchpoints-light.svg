<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">A college's two touchpoints</title><desc id="d">Allotment confirmed when payment clears, then reporting day with a QR code. An unscanned QR code makes the seat unclaimed.</desc>
<text x="24" y="38" font-size="21" font-weight="700" fill="#111113" text-anchor="start">A college's two touchpoints</text>
<text x="24" y="62" font-size="14" font-weight="400" fill="#5c5c64" text-anchor="start">Both happen after counselling</text>
<text x="24" y="100" font-size="16" font-weight="700" fill="#111113" text-anchor="start">1. Allotment confirmed</text>
<rect x="24" y="112" width="220" height="64" rx="14" fill="#f6f6f8" stroke="#4d82e0" stroke-width="2.5"/>
<text x="134.0" y="150.0" font-size="13.5" font-weight="700" fill="#111113" text-anchor="middle">Student's payment clears</text>
<rect x="300" y="112" width="250" height="64" rx="14" fill="#f6f6f8" stroke="#ee9d2b" stroke-width="2.5"/>
<text x="425.0" y="140.5" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Record sent to the college</text>
<text x="425.0" y="162.5" font-size="13" font-weight="400" fill="#5c5c64" text-anchor="middle">automatically</text>
<line x1="246" y1="144" x2="298" y2="144" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M298.0,144.0 L288.1,148.8 L288.1,139.2 Z" fill="#5c5c64"/>
<text x="24" y="222" font-size="16" font-weight="700" fill="#111113" text-anchor="start">2. Reporting day</text>
<rect x="24" y="234" width="220" height="64" rx="14" fill="#f6f6f8" stroke="#4d82e0" stroke-width="2.5"/>
<text x="134.0" y="262.5" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Student shows</text>
<text x="134.0" y="284.5" font-size="13" font-weight="400" fill="#5c5c64" text-anchor="middle">a unique QR code</text>
<rect x="300" y="234" width="170" height="64" rx="14" fill="#f6f6f8" stroke="#8a5cf0" stroke-width="2.5"/>
<text x="385.0" y="272.0" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Staff scan it</text>
<rect x="540" y="234" width="196" height="64" rx="14" fill="#f6f6f8" stroke="#34a56f" stroke-width="2.5"/>
<text x="638.0" y="272.0" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Marked as reported</text>
<line x1="246" y1="266" x2="298" y2="266" stroke="#5c5c64" stroke-width="2.5" stroke-linecap="round"/>
<path d="M298.0,266.0 L288.1,270.8 L288.1,261.2 Z" fill="#5c5c64"/>
<line x1="472" y1="266" x2="538" y2="266" stroke="#34a56f" stroke-width="2.5" stroke-linecap="round"/>
<path d="M538.0,266.0 L528.1,270.8 L528.1,261.2 Z" fill="#34a56f"/>
<text x="505" y="252" font-size="12.5" font-weight="600" fill="#34a56f" text-anchor="middle">Scanned</text>
<line x1="385" y1="300" x2="385" y2="336" stroke="#ee9d2b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M385.0,336.0 L380.2,326.1 L389.8,326.1 Z" fill="#ee9d2b"/>
<text x="440" y="324" font-size="12.5" font-weight="600" fill="#ee9d2b" text-anchor="middle">Not scanned</text>
<rect x="240" y="338" width="320" height="70" rx="14" fill="#f6f6f8" stroke="#ee9d2b" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="400.0" y="369.5" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Seat counted as unclaimed</text>
<text x="400.0" y="391.5" font-size="13" font-weight="400" fill="#5c5c64" text-anchor="middle">Fed back for the next round or spot round</text>
</svg>